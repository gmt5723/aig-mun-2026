<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E1A38" />
      <stop offset="100%" stop-color="#03050B" />
    </radialGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#C5D3E8" />
      <stop offset="100%" stop-color="#7B92B5" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8CCEFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3A639B" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer circle background -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#4A7CBE" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Faint celestial grid lines -->
  <ellipse cx="32" cy="32" rx="24" ry="12" fill="none" stroke="#8CCEFF" stroke-width="0.75" stroke-opacity="0.25" transform="rotate(-20 32 32)" />
  <circle cx="32" cy="32" r="26" fill="none" stroke="#8CCEFF" stroke-width="0.5" stroke-opacity="0.2" stroke-dasharray="2 3" />

  <!-- Glowing Earth Sphere -->
  <circle cx="42" cy="27" r="9" fill="#0A2246" />
  <circle cx="42" cy="27" r="9" fill="none" stroke="#8CCEFF" stroke-width="1" stroke-opacity="0.6" filter="url(#glow)" />
  <circle cx="40" cy="25" r="3" fill="#8CCEFF" fill-opacity="0.3" />

  <!-- Stylized Monogram "AiG" -->
  <text x="21" y="42" font-family="'Cinzel', serif" font-weight="900" font-size="28" fill="url(#silverGrad)" text-anchor="middle" filter="url(#glow)">A</text>
  
  <!-- Orbiting ring cutting through A -->
  <ellipse cx="32" cy="33" rx="26" ry="7" fill="none" stroke="url(#orbitGrad)" stroke-width="1.5" transform="rotate(-25 32 33)" />
  
  <!-- Small orbiting moon -->
  <circle cx="12" cy="38" r="2.2" fill="#E2E8F0" filter="url(#glow)" />
  <circle cx="53" cy="28" r="1.5" fill="#8CCEFF" />

  <!-- 4-point star accent -->
  <path d="M 32 6 L 33 11 L 38 12 L 33 13 L 32 18 L 31 13 L 26 12 L 31 11 Z" fill="#FFFFFF" opacity="0.8" />
</svg>
